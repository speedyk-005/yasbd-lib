[project]
name = "yasbd-lib"
version = "0.15.0"
description = "A high-accuracy, rule-based Sentence Boundary Detector (SBD) with a drop-in adapter for pysbd, delivering faster and more accurate segmentation."
authors = [
  { name = "speedyk_005", email = "speedy40115719@gmail.com" }
]

license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]

keywords = [
  "sentence-segmentation", "sentence-boundary-detection", "sbd", "sentence-splitting",
  "sentence-splitter", "multilingual", "text processing", "text-splitting",
  "natural language processing", "nlp"
]

dependencies = [
  "loguru>=0.7.3,<1.0",
  "regex>=2024.11.6",
  "ftfy>=6.2.0,<7.0",
  "retrie>=0.3.0,<1.0",
  "radicli>=0.0.25,<1.0",
  "beartype>=0.22.6,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.2.1",
  "pre-commit>=4.4.0",
  "pydoc-markdown>=4.8.0,<5.0",
  "ruff>=0.14.14",
]

bench = [
  "pysbd",
  "sentencex",
  "sentsplit",  # depends on deprecated pkg_resources — needs setuptools<81
  "nupunkt; python_version >= '3.11'",
  "blingfire",
  "sentence-splitter",
  "setuptools<81",
  "matplotlib",
  "rich",
  "radicli",
]

[project.urls]
Homepage = "https://github.com/speedyk-005/yasbd-lib"
Repository = "https://github.com/speedyk-005/yasbd-lib"
Documentation = "https://speedyk-005.github.io/yasbd/"
Issues = "https://github.com/speedyk-005/yasbd-lib/issues"
Changelog = "https://github.com/speedyk-005/yasbd-lib/blob/main/CHANGELOG.md"

[project.scripts]
yasbd = "yasbd.cli:main"

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "yasbd",
    "yasbd.utils",
    "yasbd.rules",
]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "--doctest-modules --cov=yasbd --cov-report=term-missing:skip-covered --durations=10 --ignore=src/yasbd/utils/spacy_component.py"
testpaths = ["tests", "src/yasbd/utils", "src/yasbd/cli.py"]
python_files = "test_*.py"

[tool.coverage.run]
omit = ["*/_template.py", "*/cleaner_stub.py", "*/cli.py"]

[tool.ruff]
target-version = "py310"
line-length = 95

[tool.ruff.lint]
select = [
    "A",      # Built-in shadowing and variable shadowing checks
    "ARG",    # Unused function and method arguments
    "B",      # Likely bugs and dangerous patterns (flake8-bugbear)
    "BLE",    # Blind exception handling (e.g. bare except)
    "C90",    # McCabe complexity checks
    "E",      # pycodestyle errors (PEP 8 violations)
    "ERA",    # Commented-out dead code detection
    "F",      # Pyflakes logical and static analysis errors
    "FBT",    # Boolean positional argument "traps"
    "FIX",    # TODO, FIXME, XXX comment detection
    "FURB",   # Refactoring and modernization suggestions (refurb)
    "I",      # Import sorting and organization (isort)
    "ICN",    # Import alias naming conventions
    "INP",    # Missing __init__.py package checks
    "N",      # PEP 8 naming conventions (pep8-naming)
    "PERF",   # Performance anti-patterns
    "PGH",    # Pygrep-hooks rules and miscellaneous checks
    "PIE",    # Unnecessary or non-pythonic code patterns
    "PL",     # Pylint-derived checks
    "PT",     # Pytest style and correctness checks
    "PTH",    # Prefer pathlib over os/path utilities
    "Q",      # Quote style consistency
    "RET",    # Return statement consistency and simplification
    "RSE",    # Raise statement improvements
    "RUF",    # Ruff-specific rules
    "S",      # Security issues and insecure code patterns (bandit)
    "SLF",    # Access to private members
    "SIM",    # Code simplification opportunities
    "TC",     # Type-checking block optimizations
    "TCH",    # Move typing-only imports into TYPE_CHECKING blocks
    "TID",    # Import restriction and tidiness rules
    "T10",    # Debugger breakpoint detection
    "UP",     # Python syntax and API modernization (pyupgrade)
    "W",      # pycodestyle warnings
]
ignore = ["PLW2901", "COM812", "D203", "D213", "RUF001", "RUF003", "RUF012", "S311", "FURB167", "PLC0206", "PLC0415", "PERF203"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "I001"]
"cli.py" = ["PLR0913", "PLR0917", "UP045", "FBT001", "FBT002", "PTH123", "S603"]
"src/yasbd/rules/base.py" = ["FBT001", "PLR2004", "SLF001"]
"src/yasbd/utils/*.py" = ["E501", "BLE001", "FBT001", "FBT002", "PLR2004"]
"tests/*" = ["E501", "S101", "PLR2004", "Q0", "ERA001", "SLF001", "PT006", "ARG002"]
"benchmarks/*" = ["E501", "FBT001", "FBT002", "PLR2004", "BLE001", "INP001"]

[tool.ruff.format]
exclude = [".git", ".venv", "build", "dist", "tests/*.py", "*/EN_GOLDEN_DATA.py"]
