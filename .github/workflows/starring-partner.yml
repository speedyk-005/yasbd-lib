name: Starring Partner

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  starcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether user starred the repository
        id: star
        uses: gacts/is-stargazer@v1

      - name: Ask user to star the repository
        if: steps.star.outputs.is-stargazer != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `👋 Welcome! Thanks for opening an issue.

              Before we dive in, if you've found this project helpful, we'd really appreciate a ⭐.

              Every star motivates the contributors and helps more people discover the project. ❤️`
            });
